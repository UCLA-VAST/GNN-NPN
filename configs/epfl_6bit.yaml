seed: 42
num_workers: 16
load: null
dataset:
  - cls: epfl
    name: "epfl_6bit"
    root: "benchmarks"
    num_bit: 6
    rewriting: false
    action: null
    train_split: 0.98
    val_split: 0.01
agent:
  num_rounds: 3
  dim_hidden: 128
  enable_reverse: true
  enable_layernorm: true
supervised:
  train_steps: 10000
  batch_size: 64
  lr: 2e-5
  grad_clip: 1.0
  log_interval: 100
  eval_interval: 1000
  dir: "runs/epfl/6bit/supervised"
reinforcement:
  batch_size: 64
  group_size: 16
  temp: 1.0
  post_proc: sifting_npn
  grpo:
    train_steps: 10000
    raw_reward: true
    num_epoch: 4
    clip_eps: 0.2
    ent_coef: 0.0001
    lr: 2e-5
    grad_clip: 1.0
    log_interval: 100
    eval_interval: 1000
    dir: "runs/epfl/6bit/grpo"
npn:
  trial: 16
  temp: 1.0
  post_proc: sifting_npn
  truth_table_path: "results/epfl_truth_tables_6bit.txt"
  indices_path: "results/epfl_unique_indices_6bit.txt"
  inference_batch_size: 64
  inference_results_path: "results/epfl_inference_results_6bit.pt"
